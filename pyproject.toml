[project]
name = "davssyms"
version = "1.0.0"
description = "DAgger versus symmetric sampling (RLPD) on SuperTuxKart"
requires-python = ">=3.12"
dependencies = [
    "pystk2-gymnasium[cli,web]==0.10.0",
    "torch",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "omegaconf",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "methods", "experts"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "experts/team4",
    "stk_actor",
    "scripts/submit.py",
    "scripts/check_submission.py",
    "scripts/submission_files.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"common/analysis.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["common", "methods", "experts"]
